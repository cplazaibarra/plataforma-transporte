services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: lastmile_postgres
    restart: always
    environment:
      POSTGRES_USER: lastmile_user
      POSTGRES_PASSWORD: lastmile_password
      POSTGRES_DB: lastmile_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmile_user -d lastmile_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lastmile_backend
    restart: always
    environment:
      PORT: 8095
      DB_HOST: lastmile_postgres
      DB_PORT: 5432
      DB_USER: lastmile_user
      DB_PASSWORD: lastmile_password
      DB_NAME: lastmile_db
    ports:
      - "8095:8095"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lastmile_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8095/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8095/ws
    depends_on:
      - backend

volumes:
  postgres_data:
